<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="3" width="6" height="18" rx="2" fill="currentColor"/>
          <rect x="3" y="9" width="18" height="6" rx="2" fill="currentColor"/>
        </svg>
        <span class="logo-text">MediZano Botica</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ng-container *ngFor="let item of visibleNavItems">
        
        <!-- Menú Desplegable con Sub-items (ej: Compras) -->
        <div *ngIf="item.subItems && item.subItems.length > 0" class="nav-item-dropdown">
          <button 
            type="button" 
            class="nav-item nav-item-parent" 
            [class.active]="isParentActive(item)" 
            (click)="toggleMenu(item.route)"
            [attr.aria-expanded]="isMenuOpen(item.route)">
            <svg-icon [name]="item.icon" class="nav-icon"></svg-icon>
            <span class="nav-label">{{ item.label }}</span>
            <span class="dropdown-chevron" [class.open]="isMenuOpen(item.route)">▾</span>
          </button>
          
          <div class="submenu" *ngIf="isMenuOpen(item.route)">
            <a
              *ngFor="let sub of item.subItems"
              [routerLink]="sub.route"
              [class.active]="isSubItemActive(sub.route)"
              class="submenu-item">
              <span class="submenu-dot">•</span>
              <span class="submenu-label">{{ sub.label }}</span>
            </a>
          </div>
        </div>

        <!-- Item Regular Simple (sin sub-items) -->
        <a
          *ngIf="!item.subItems || item.subItems.length === 0"
          [routerLink]="item.route"
          routerLinkActive="active"
          [class.active]="isActive(item.route)"
          class="nav-item"
          [attr.aria-label]="item.label">
          <svg-icon [name]="item.icon" class="nav-icon"></svg-icon>
          <span class="nav-label">{{ item.label }}</span>
        </a>

      </ng-container>
    </nav>

    <div class="sidebar-footer">
      <div class="user-menu">
        <div class="user-avatar">
          <svg-icon name="user" class="avatar-icon"></svg-icon>
        </div>
        <div class="user-info">
          <div class="user-name" *ngIf="authService.currentUser$ | async as user">
            {{ user.fullName || user.username }}
          </div>
          <div class="user-role" *ngIf="authService.currentUser$ | async as user">
            {{ getRoleLabel(user.role) }}
          </div>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()" [attr.aria-label]="'Cerrar sesión'">
        <svg-icon name="logout" class="logout-icon"></svg-icon>
        <span class="logout-text">Salir</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
