services:
  frontend:
    ports: !override []

  eureka-server:
    ports: !override []

  api-gateway:
    ports: !override []
    environment:
      CORS_ALLOWED_ORIGINS: https://${MEDIZANO_DOMAIN:-medizano.sbs},https://www.${MEDIZANO_DOMAIN:-medizano.sbs}

  usuario-ms:
    environment:
      SECURITY_CORS_ALLOWED_ORIGINS: https://${MEDIZANO_DOMAIN:-medizano.sbs},https://www.${MEDIZANO_DOMAIN:-medizano.sbs}

  pago-ms:
    environment:
      PAYPAL_CHECKOUT_BASE_URL: https://${MEDIZANO_DOMAIN:-medizano.sbs}
      MERCADOPAGO_CHECKOUT_BASE_URL: https://${MEDIZANO_DOMAIN:-medizano.sbs}

  prometheus:
    profiles: ["observability"]

  loki:
    profiles: ["observability"]

  grafana-alloy:
    profiles: ["observability"]

  grafana:
    profiles: ["observability"]

  caddy:
    image: caddy:2.10-alpine
    container_name: medizano-caddy
    restart: always
    environment:
      MEDIZANO_DOMAIN: ${MEDIZANO_DOMAIN:-medizano.sbs}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - medizano-net

volumes:
  caddy_data:
  caddy_config:
