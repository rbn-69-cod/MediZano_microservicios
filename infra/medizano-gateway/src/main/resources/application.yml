server:
  port: 8090

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # Autenticación, Usuarios y Auditoría
        - id: usuario-service
          uri: lb://usuario-ms
          predicates:
            - Path=/api/auth/**, /api/admin/users/**, /api/admin/audit/**
        # Catálogo de Productos y Medicamentos Farmacéuticos
        - id: catalogo-service
          uri: lb://inventario-ms
          predicates:
            - Path=/api/v1/productos, /api/v1/productos/**, /api/pharmacist/medicines, /api/pharmacist/medicines/**

        # Inventario, Lotes y Stock
        - id: inventario-service
          uri: lb://inventario-ms
          predicates:
            - Path=/api/v1/inventario, /api/v1/inventario/**, /api/pharmacist/batches, /api/pharmacist/batches/**

        # Clientes
        - id: cliente-service
          uri: lb://cliente-ms
          predicates:
            - Path=/api/v1/clientes, /api/v1/clientes/**

        # Órdenes de compra transaccionales
        - id: orden-service
          uri: lb://orden-ms
          predicates:
            - Path=/api/v1/ordenes, /api/v1/ordenes/**

        # Facturación, POS Ventas y Devoluciones
        - id: facturacion-service
          uri: lb://facturacion-ms
          predicates:
            - Path=/api/v1/facturacion, /api/v1/facturacion/**, /api/cashier/bills, /api/cashier/bills/**, /api/cashier/returns, /api/cashier/returns/**

        # Reportes y consultas administrativas
        - id: reportes-service
          uri: lb://reportes-ms
          predicates:
            - Path=/api/admin/reports, /api/admin/reports/**

        # Proveedores, Laboratorios y Compras
        - id: proveedor-service
          uri: lb://proveedor-ms
          predicates:
            - Path=/api/v1/proveedores, /api/v1/proveedores/**, /api/v1/compras, /api/v1/compras/**

        # Pasarelas de Pago (PayPal Sandbox y Mercado Pago)
        - id: pago-service
          uri: lb://pago-ms
          predicates:
            - Path=/api/v1/pagos, /api/v1/pagos/**, /api/cashier/paypal/**, /api/cashier/mercadopago/**

        # Documentacion OpenAPI / Swagger Centralizada
        - id: usuario-docs
          uri: lb://usuario-ms
          predicates:
            - Path=/v3/api-docs/usuario
          filters:
            - SetPath=/v3/api-docs

        - id: cliente-docs
          uri: lb://cliente-ms
          predicates:
            - Path=/v3/api-docs/cliente
          filters:
            - SetPath=/v3/api-docs

        - id: orden-docs
          uri: lb://orden-ms
          predicates:
            - Path=/v3/api-docs/orden
          filters:
            - SetPath=/v3/api-docs

        - id: inventario-docs
          uri: lb://inventario-ms
          predicates:
            - Path=/v3/api-docs/inventario
          filters:
            - SetPath=/v3/api-docs

        - id: facturacion-docs
          uri: lb://facturacion-ms
          predicates:
            - Path=/v3/api-docs/facturacion
          filters:
            - SetPath=/v3/api-docs

        - id: reportes-docs
          uri: lb://reportes-ms
          predicates:
            - Path=/v3/api-docs/reportes
          filters:
            - SetPath=/v3/api-docs

        - id: pago-docs
          uri: lb://pago-ms
          predicates:
            - Path=/v3/api-docs/pago
          filters:
            - SetPath=/v3/api-docs

        - id: proveedor-docs
          uri: lb://proveedor-ms
          predicates:
            - Path=/v3/api-docs/proveedor
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Usuarios y Autenticacion JWT (usuario-ms)
        url: /v3/api-docs/usuario
      - name: 2. Productos, Medicamentos, Stock y Lotes (inventario-ms)
        url: /v3/api-docs/inventario
      - name: 3. Clientes y Directorio (cliente-ms)
        url: /v3/api-docs/cliente
      - name: 4. Ordenes de Compra POS (orden-ms)
        url: /v3/api-docs/orden
      - name: 5. Facturacion, Ventas y Devoluciones (facturacion-ms)
        url: /v3/api-docs/facturacion
      - name: 6. Reportes y Analitica (reportes-ms)
        url: /v3/api-docs/reportes
      - name: 7. Pasarelas de Pago PayPal y Mercado Pago (pago-ms)
        url: /v3/api-docs/pago
      - name: 8. Proveedores y Laboratorios (proveedor-ms)
        url: /v3/api-docs/proveedor


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URI:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
