server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # Autenticación, Usuarios y Auditoría
        - id: usuario-service
          uri: lb://usuario-ms
          predicates:
            - Path=/api/auth/**, /api/admin/users/**, /api/admin/audit/**

        # Catálogo de Productos y Medicamentos Farmacéuticos
        - id: catalogo-service
          uri: lb://catalogo-ms
          predicates:
            - Path=/api/v1/productos/**, /api/pharmacist/medicines/**

        # Inventario, Lotes y Stock
        - id: inventario-service
          uri: lb://inventario-ms
          predicates:
            - Path=/api/v1/inventario/**, /api/pharmacist/batches/**

        # Clientes
        - id: cliente-service
          uri: lb://cliente-ms
          predicates:
            - Path=/api/v1/clientes/**

        # Órdenes de compra transaccionales
        - id: orden-service
          uri: lb://orden-ms
          predicates:
            - Path=/api/v1/ordenes/**

        # Facturación, POS Ventas, Devoluciones y Reportes
        - id: facturacion-service
          uri: lb://facturacion-ms
          predicates:
            - Path=/api/v1/facturacion/**, /api/cashier/bills/**, /api/cashier/returns/**, /api/admin/reports/**

        # Pasarelas de Pago (PayPal Sandbox y Mercado Pago)
        - id: pago-service
          uri: lb://pago-ms
          predicates:
            - Path=/api/v1/pagos/**, /api/cashier/paypal/**, /api/cashier/mercadopago/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URI:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
