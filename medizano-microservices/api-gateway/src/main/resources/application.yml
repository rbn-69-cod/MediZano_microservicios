server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # Autenticación, Usuarios y Auditoría
        - id: usuario-service
          uri: lb://usuario-ms
          predicates:
            - Path=/api/auth/**, /api/admin/users/**, /api/admin/audit/**
        # Catálogo de Productos y Medicamentos Farmacéuticos
        - id: catalogo-service
          uri: lb://catalogo-ms
          predicates:
            - Path=/api/v1/productos/**, /api/pharmacist/medicines/**

        # Inventario, Lotes y Stock
        - id: inventario-service
          uri: lb://inventario-ms
          predicates:
            - Path=/api/v1/inventario/**, /api/pharmacist/batches/**

        # Clientes
        - id: cliente-service
          uri: lb://cliente-ms
          predicates:
            - Path=/api/v1/clientes/**

        # Órdenes de compra transaccionales
        - id: orden-service
          uri: lb://orden-ms
          predicates:
            - Path=/api/v1/ordenes/**

        # Facturación, POS Ventas, Devoluciones y Reportes
        - id: facturacion-service
          uri: lb://facturacion-ms
          predicates:
            - Path=/api/v1/facturacion/**, /api/cashier/bills/**, /api/cashier/returns/**, /api/admin/reports/**

        # Pasarelas de Pago (PayPal Sandbox y Mercado Pago)
        - id: pago-service
          uri: lb://pago-ms
          predicates:
            - Path=/api/v1/pagos/**, /api/cashier/paypal/**, /api/cashier/mercadopago/**

        # Documentacion OpenAPI / Swagger Centralizada
        - id: usuario-docs
          uri: lb://usuario-ms
          predicates:
            - Path=/v3/api-docs/usuario
          filters:
            - SetPath=/v3/api-docs

        - id: catalogo-docs
          uri: lb://catalogo-ms
          predicates:
            - Path=/v3/api-docs/catalogo
          filters:
            - SetPath=/v3/api-docs

        - id: cliente-docs
          uri: lb://cliente-ms
          predicates:
            - Path=/v3/api-docs/cliente
          filters:
            - SetPath=/v3/api-docs

        - id: orden-docs
          uri: lb://orden-ms
          predicates:
            - Path=/v3/api-docs/orden
          filters:
            - SetPath=/v3/api-docs

        - id: inventario-docs
          uri: lb://inventario-ms
          predicates:
            - Path=/v3/api-docs/inventario
          filters:
            - SetPath=/v3/api-docs

        - id: facturacion-docs
          uri: lb://facturacion-ms
          predicates:
            - Path=/v3/api-docs/facturacion
          filters:
            - SetPath=/v3/api-docs

        - id: pago-docs
          uri: lb://pago-ms
          predicates:
            - Path=/v3/api-docs/pago
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Usuarios y Autenticacion JWT (usuario-ms)
        url: /v3/api-docs/usuario
      - name: 2. Catalogo y Medicamentos (catalogo-ms)
        url: /v3/api-docs/catalogo
      - name: 3. Clientes y Directorio (cliente-ms)
        url: /v3/api-docs/cliente
      - name: 4. Inventario y Lotes Farmaceuticos (inventario-ms)
        url: /v3/api-docs/inventario
      - name: 5. Ordenes de Compra POS (orden-ms)
        url: /v3/api-docs/orden
      - name: 6. Facturacion, Ventas y Reportes (facturacion-ms)
        url: /v3/api-docs/facturacion
      - name: 7. Pasarelas de Pago PayPal y Mercado Pago (pago-ms)
        url: /v3/api-docs/pago


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URI:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
