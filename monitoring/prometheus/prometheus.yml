global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8090']
        labels:
          service: 'api-gateway'
          application: 'MediZano POS'

  - job_name: 'usuario-ms'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['usuario-ms:8087']
        labels:
          service: 'usuario-ms'
          application: 'MediZano POS'

