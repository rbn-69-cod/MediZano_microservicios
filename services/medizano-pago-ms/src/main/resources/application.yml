server:
  port: 8083

spring:
  application:
    name: pago-ms
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/medizano_pagos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

security:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}

payments:
  confirmation-retry-delay-ms: ${PAYMENT_CONFIRMATION_RETRY_DELAY_MS:30000}

culqi:
  api-base-url: ${CULQI_API_BASE_URL:https://api.culqi.com/v2}
  public-key: ${CULQI_PUBLIC_KEY:}
  secret-key: ${CULQI_SECRET_KEY:}
  webhook-secret: ${CULQI_WEBHOOK_SECRET:}
  qr-expiration-minutes: ${CULQI_QR_EXPIRATION_MINUTES:15}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
